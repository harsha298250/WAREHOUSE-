name: Smart Warehouse Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-imports-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Imports
        run: |
          python -c "import backend.main; import backend.database; import backend.models; print('Imports verified successfully.')"

      - name: Lint and Syntax Validation
        run: |
          python -m py_compile $(find backend/ ml/ tests/ -name "*.py")
          echo "Syntax check complete."

  backend-tests:
    runs-on: ubuntu-latest
    needs: validate-imports-and-syntax
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          TEST_DB_NAME: sqlite
          ENVIRONMENT: development
          JWT_SECRET_KEY: test-only-secret-do-not-use-in-production
        run: |
          python -m pytest

  database-migrations:
    runs-on: ubuntu-latest
    needs: validate-imports-and-syntax
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: warehouse_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Migration Script Upgrades
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/warehouse_test_db
        run: |
          alembic upgrade head
          echo "Migrations applied successfully."

  docker-build:
    runs-on: ubuntu-latest
    needs: validate-imports-and-syntax
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t warehouse-platform-web:latest .
          echo "Docker image built successfully."

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-playwright
          playwright install --with-deps chromium

      - name: Run Backend App in Background
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: development
          JWT_SECRET_KEY: test-only-secret-do-not-use-in-production
        run: |
          # Seed SQLite DB and start uvicorn
          python backend/init_db.py
          python backend/seed_demo_data.py
          nohup uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          # Wait for application startup
          sleep 5
          curl -f http://localhost:8000/health

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: development
        run: |
          python -m pytest tests/e2e/test_playwright.py
